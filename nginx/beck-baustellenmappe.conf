# ============================================================
# Beck Baustellenmappe – Nginx Config (VPS)
# Speichern unter: /etc/nginx/sites-available/beck-baustellenmappe
# Aktivieren:      ln -s /etc/nginx/sites-available/beck-baustellenmappe /etc/nginx/sites-enabled/
# SSL:             certbot --nginx -d baustelle.sebma.ipv64.de
# ============================================================

server {
    listen 80;
    server_name baustelle.sebma.ipv64.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name baustelle.sebma.ipv64.de;

    # SSL (von certbot automatisch befüllt)
    ssl_certificate     /etc/letsencrypt/live/baustelle.sebma.ipv64.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baustelle.sebma.ipv64.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Frontend (statisch gebaut)
    root /var/www/beck-baustellenmappe;
    index index.html;

    # React Router – alle Routen auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Datei-Upload: bis 50 MB
        client_max_body_size 50M;
    }

    # Uploads (über Backend auth-geschützt)
    location /uploads/ {
        proxy_pass       http://127.0.0.1:3004;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
